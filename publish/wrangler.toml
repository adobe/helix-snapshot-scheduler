# Top-level configuration
account_id = "852dfa4ae1b0d579df29be65b986c101"
name = "helix-snapshot-scheduler-publish-prod"
main = "src/index.js"
compatibility_date = "2023-05-05"

[[kv_namespaces]]
binding = "SCHEDULER_KV"
id = "11afb687a55f4cb29bcba5e50e1754a2"
preview_id = "bbd7a7c511834e80875bda0c6bcc43c2"

[[r2_buckets]]
binding = 'R2_BUCKET'
bucket_name = 'helix-snapshot-scheduler'
preview_bucket_name = 'helix-snapshot-scheduler-ci'

[[queues.consumers]]
queue = "helix-snapshot-scheduler-publish"
max_retries = 5
max_batch_size = 5
retry_delay = 60
max_wait_time_ms = 3600000
dead_letter_queue = "helix-snapshot-scheduler-dlq"
# Retry strategy: each message is acked or retried on its own. Transient failures
# (5xx, 429, network) retry with exponential backoff; permanent ones (400/401/403/404)
# are recorded in failed/ without retry.
# After max retries, failed messages are sent to DLQ for investigation

[[queues.producers]]
queue = "helix-snapshot-scheduler-dlq"
binding = "DLQ"

[observability]
enabled = true