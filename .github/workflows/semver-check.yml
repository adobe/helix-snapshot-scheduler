name: Conventional Commit
on:
  pull_request:
    types: [ opened, synchronize, reopened, edited ]

permissions:
  pull-requests: read

jobs:
  semver:
    runs-on: ubuntu-latest
    steps:
      - name: Check conventional commit PR title
        uses: amannn/action-semantic-pull-request@v6
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          # Optional scope; when present it must name one of the workers.
          scopes: |
            publish
            cron
            register
            dlq
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
